name: Build VictorianOS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check project files
        run: |
          echo "Repository contents:"
          ls -lah

          if [ ! -f "VictorianOS_v0_01_fixed.zip" ]; then
            echo "ERROR: VictorianOS_v0_01_fixed.zip was not found."
            exit 1
          fi

      - name: Extract VictorianOS
        run: |
          rm -rf VictorianOS
          mkdir -p VictorianOS
          unzip -o VictorianOS_v0_01_fixed.zip -d VictorianOS

          echo "Extracted project:"
          find VictorianOS -maxdepth 3 -type f | head -50

      - name: Configure Java 17
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle.kts not found. "
                  "The ZIP structure is not what the workflow expected."
              )

          text = path.read_text()

          # Remove an old compileOptions block if one already exists,
          # so repeated builds don't create duplicates.
          text = re.sub(
              r'\n\s*compileOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          compile_options = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          text = text.replace(
              "android {",
              "android {" + compile_options,
              1
          )

          path.write_text(text)

          print("Updated app/build.gradle.kts:")
          print(path.read_text())
          PY

      - name: Verify Android project
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: |
          echo "Current directory:"
          pwd

          echo
          echo "Project contents:"
          ls -lah

          echo
          echo "App contents:"
          ls -lah app

          echo
          echo "Java version:"
          java -version

          echo
          echo "Gradle version:"
          gradle --version

      - name: Build VictorianOS APK
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          APK="VictorianOS/VictorianOS_v0_01/shell/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find VictorianOS -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK successfully built:"
          ls -lh "$APK"

      - name: Upload VictorianOS APK
        uses: actions/upload-artifact@v4
        with:
          name: VictorianOS-v0.01.1-APK
          path: VictorianOS/VictorianOS_v0_01/shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
