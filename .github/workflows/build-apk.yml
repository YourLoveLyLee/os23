name: Build VictorianOS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip VictorianOS
        run: unzip -o VictorianOS_v0_01.zip -d VictorianOS

      - name: Fix JVM target
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r"sourceCompatibility\s*=\s*JavaVersion\.[A-Za-z0-9_]+",
              "sourceCompatibility = JavaVersion.VERSION_17",
              text,
          )

          text = re.sub(
              r"targetCompatibility\s*=\s*JavaVersion\.[A-Za-z0-9_]+",
              "targetCompatibility = JavaVersion.VERSION_17",
              text,
          )

          if "compileOptions {" not in text:
              marker = "android {"

              if marker not in text:
                  raise SystemExit(
                      "Could not find the android block in app/build.gradle.kts"
                  )

              text = text.replace(
                  marker,
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1,
              )

          path.write_text(text)
          print("Java JVM target set to 17.")
          PY

      - name: Fix BatteryManager startup crash
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/java/com/lee/victorianos/shell")
          patched = 0

          for path in root.rglob("*.kt"):
              text = path.read_text()
              original = text

              text = re.sub(
                  r"getSystemService\(\s*Context\.BATTERY_SERVICE\s*\)\s+as\s+BatteryManager",
                  "getSystemService(Context.BATTERY_SERVICE) as? BatteryManager ?: return",
                  text,
              )

              text = re.sub(
                  r"getSystemService\(\s*BATTERY_SERVICE\s*\)\s+as\s+BatteryManager",
                  "getSystemService(BATTERY_SERVICE) as? BatteryManager ?: return",
                  text,
              )

              if text != original:
                  path.write_text(text)
                  patched += 1
                  print(f"Patched BatteryManager in: {path}")

          print(f"BatteryManager patch applied to {patched} file(s).")
          PY

      - name: Build APK
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VictorianOS-APK
          path: VictorianOS/VictorianOS_v0_01/shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error          text = path.read_text()

          # Replace existing Java compatibility values if present.
          text = re.sub(
              r"sourceCompatibility\s*=\s*JavaVersion\.[A-Za-z0-9_]+",
              "sourceCompatibility = JavaVersion.VERSION_17",
              text
          )

          text = re.sub(
              r"targetCompatibility\s*=\s*JavaVersion\.[A-Za-z0-9_]+",
              "targetCompatibility = JavaVersion.VERSION_17",
              text
          )

          # Add compileOptions if the project doesn't already have them.
          if "compileOptions {" not in text:
              text = text.replace(
                  "android {",
                  """android {

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """,
                  1
              )

          path.write_text(text)

          print("Java JVM target set to 17.")
          PY

      - name: Fix BatteryManager startup crash
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "app/src/main/java/com/lee/victorianos/shell"
          )

          patched = 0

          for path in root.rglob("*.kt"):
              text = path.read_text()
              original = text

              # Prevent crashes when Android returns null for BatteryManager.
              text = re.sub(
                  r'getSystemService\(\s*Context\.BATTERY_SERVICE\s*\)\s+as\s+BatteryManager',
                  'getSystemService(Context.BATTERY_SERVICE) as? BatteryManager ?: return',
                  text
              )

              text = re.sub(
                  r'getSystemService\(\s*BATTERY_SERVICE\s*\)\s+as\s+BatteryManager',
                  'getSystemService(BATTERY_SERVICE) as? BatteryManager ?: return',
                  text
              )

              if text != original:
                  path.write_text(text)
                  patched += 1
                  print(f"Patched BatteryManager in: {path}")

          print(f"BatteryManager patch applied to {patched} file(s).")
          PY

      - name: Build APK
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VictorianOS-APK
          path: VictorianOS/VictorianOS_v0_01/shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """,
              1
          )

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VictorianOS-APK
          path: VictorianOS/VictorianOS_v0_01/shell/app/build/outputs/apk/debug/app-debug.apk
