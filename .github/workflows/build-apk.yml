name: Build VictorianOS v0.02 APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build VictorianOS Command Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify source archive
        run: |
          echo "Repository contents:"
          ls -lah

          if [ ! -f "VictorianOS_v0_02_CommandCore.zip" ]; then
            echo ""
            echo "ERROR: VictorianOS_v0_02_CommandCore.zip was not found."
            echo "Upload the v0.02 ZIP to the root of the repository."
            exit 1
          fi

      - name: Extract VictorianOS v0.02
        run: |
          rm -rf VictorianOS
          mkdir -p VictorianOS

          unzip -o VictorianOS_v0_02_CommandCore.zip -d VictorianOS

          echo ""
          echo "Extracted source tree:"
          find VictorianOS -maxdepth 4 -type f | head -80

      - name: Verify Android project
        run: |
          PROJECT="VictorianOS/VictorianOS_v0_01/shell"

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "VictorianOS Android project found successfully."

      - name: Show build environment
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

      - name: Build VictorianOS v0.02
        working-directory: VictorianOS/VictorianOS_v0_01/shell
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify generated APK
        run: |
          APK="VictorianOS/VictorianOS_v0_01/shell/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Searching for APK files:"
            find VictorianOS -type f -name "*.apk" -print
            exit 1
          fi

          echo ""
          echo "VictorianOS v0.02 built successfully:"
          ls -lh "$APK"

      - name: Rename APK
        run: |
          mkdir -p output

          cp \
            VictorianOS/VictorianOS_v0_01/shell/app/build/outputs/apk/debug/app-debug.apk \
            output/VictorianOS-v0.02-CommandCore-debug.apk

          ls -lh output/

      - name: Upload VictorianOS APK
        uses: actions/upload-artifact@v4
        with:
          name: VictorianOS-v0.02-CommandCore
          path: output/VictorianOS-v0.02-CommandCore-debug.apk
          if-no-files-found: error
          retention-days: 14
